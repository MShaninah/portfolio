version: 2

updates:
  # PHP. Symfony is grouped so a patch wave arrives as one PR instead of thirty.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns: ['symfony/*']
      doctrine:
        patterns: ['doctrine/*']
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /vue
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-frontend)'

  # Keeps the action versions in ci.yml / cd.yml current, which is also what
  # makes pinning them to commit SHAs practical later.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'

  # Watches the pinned FROM tags, so a new patched PHP or nginx shows up as a
  # PR rather than being noticed by accident.
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: docker
    directory: /docker/nginx
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: docker
    directory: /docker/php-cli
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'

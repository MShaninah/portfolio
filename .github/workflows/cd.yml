name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
    env:
      # Absolute path to the PHP binary used on the server for migrations.
      #
      # It MUST be one of the tuxcare builds: /opt/plesk/php/8.4/bin/php is
      # 8.4.12 (built Aug 2025) and predates the php2shell fixes
      # (CVE-2026-109618 / CVE-2026-109619). tuxcare-php-8.5 is 8.5.12 and
      # tuxcare-php-8.4 is 8.4.27, both patched.
      DEPLOY_PHP: ${{ vars.DEPLOY_PHP || '/opt/plesk/php/tuxcare-php-8.5/bin/php' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      # Vhost directory holding releases/, shared/ and the current symlink.
      #
      # A variable, NOT a secret: it is a filesystem path, not a credential,
      # and as a secret GitHub masked it to *** in the logs, which made a
      # wrong value impossible to diagnose.
      API_DIR: ${{ vars.DEPLOY_DIR }}
      # Document root served for the SPA; receives the built dist/ directly.
      WEB_DOCROOT: ${{ vars.WEB_DOCROOT }}
      RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      # ----------------------------------------------------------- build ---
      # Built on the project's minimum PHP, so the artifact cannot depend on
      # anything newer than the floor the server might be set to.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --optimize-autoloader --classmap-authoritative --no-scripts

      # The server has no Composer, so vendor/ ships inside the release.
      - name: Warm the production cache
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
        run: php bin/console cache:warmup --env=prod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: Build the frontend
        working-directory: vue
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the release
        run: |
          set -euo pipefail
          mkdir -p release/api
          # Explicit list: tests/, vue/, docker/ and any local env file must
          # never reach the server. var/ is deliberately NOT created here -- it
          # is symlinked to shared/var on the server so it survives releases.
          cp -r bin config migrations public src vendor .env release/api/
          test ! -e release/api/.env.local
          test ! -d release/api/tests
          test ! -d release/api/var
          test -f release/api/public/.htaccess
          du -sh release/api | sed 's/^/  api release: /'
          du -sh vue/dist    | sed 's/^/  web release: /'

      # ------------------------------------------------------------- ssh ---
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            # Without this the client offers every key it can find, and a
            # shared host with a low MaxAuthTries drops the connection.
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ------------------------------------------------------- preflight ---
      - name: Preflight the server
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q WEB_DOCROOT=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$WEB_DOCROOT"
            cat <<'REMOTE'
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$API_DIR" ]     || fail "DEPLOY_DIR variable is empty"
          [ -n "$WEB_DOCROOT" ] || fail "WEB_DOCROOT variable is empty"
          [ -x "$DEPLOY_PHP" ]  || fail "no PHP binary at $DEPLOY_PHP"

          ver="$("$DEPLOY_PHP" -r 'echo PHP_VERSION;')"
          echo "server PHP: $ver"

          # Refuse to deploy onto a PHP that still carries php2shell, or onto
          # anything below what Symfony 8.1 needs (>=8.4.1).
          "$DEPLOY_PHP" -r '
            $v = PHP_VERSION;
            $ok = (version_compare($v, "8.4.27", ">=") && version_compare($v, "8.5.0", "<"))
               || version_compare($v, "8.5.12", ">=");
            exit($ok ? 0 : 1);
          ' || fail "server PHP $ver is unpatched or too old (need 8.4.27+ or 8.5.12+)"

          for ext in pdo_mysql intl zip; do
            "$DEPLOY_PHP" -m | grep -qx "$ext" || fail "PHP extension missing on the server: $ext"
          done

          # On failure, show what IS there. A hidden dotfile plus a masked path
          # made this impossible to diagnose from the log the first time.
          if [ ! -f "$API_DIR/shared/.env.local" ]; then
            echo "looked for: $API_DIR/shared/.env.local"
            echo "contents of $API_DIR:"
            ls -la "$API_DIR"        2>&1 | sed 's/^/    /' || true
            echo "contents of $API_DIR/shared:"
            ls -la "$API_DIR/shared" 2>&1 | sed 's/^/    /' || true
            fail "$API_DIR/shared/.env.local is missing - create it before the first deploy"
          fi

          mkdir -p "$API_DIR/releases" "$API_DIR/shared/var/log"
          [ -d "$WEB_DOCROOT" ] || fail "WEB_DOCROOT $WEB_DOCROOT does not exist"
          echo "preflight OK"
          REMOTE
          } | ssh target bash -s

      # ---------------------------------------------------------- deploy ---
      - name: Upload the API release
        run: |
          set -euo pipefail
          rsync -az --delete -e ssh release/api/ "target:$API_DIR/releases/$RELEASE/"

      - name: Upload the frontend
        run: |
          set -euo pipefail
          # Straight into the document root: static files, no atomic swap
          # needed, and Plesk manages that directory itself.
          #
          # --delete removes everything in the docroot that is not part of the
          # build. Plesk-managed and ACME paths are excluded so a deploy cannot
          # break certificate renewal or the panel's own plumbing. ANY OTHER
          # pre-existing content in that directory will be removed.
          rsync -az --delete \
            --exclude='cgi-bin/' \
            --exclude='.well-known/' \
            --exclude='error_docs/' \
            --exclude='.htaccess' \
            -e ssh vue/dist/ "target:$WEB_DOCROOT/"

      - name: Migrate and activate
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q RELEASE=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$RELEASE"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"

          # Record what is live now, so the rollback step has a target.
          if [ -L current ]; then
            basename "$(readlink -f current)" > .previous_release
          fi
          echo "activating $RELEASE (previous: $(cat .previous_release 2>/dev/null || echo none))"

          # Secrets live outside the release so they survive it.
          ln -sfn "$API_DIR/shared/.env.local" "releases/$RELEASE/.env.local"

          # var/cache MUST be release-local. Symfony bakes absolute paths
          # (kernel.project_dir) into the compiled container, so a cache shared
          # between releases is wrong for every release but the one that built
          # it -- and would quietly make a new release execute the previous
          # one's code. Only the log directory is shared.
          mkdir -p "releases/$RELEASE/var"
          ln -sfn "$API_DIR/shared/var/log" "releases/$RELEASE/var/log"

          # Compile this release's container explicitly. Without this the first
          # command to run builds it implicitly, and any failure shows up as a
          # confusing "there are no commands defined in the ... namespace"
          # instead of the actual error.
          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" cache:warmup --env=prod

          # Migrate BEFORE the symlink flips, so traffic never meets a schema
          # the running code does not expect.
          #
          # --env=prod is explicit and must stay that way. Without it the
          # command falls back to APP_ENV from .env/.env.local; the committed
          # .env defaults that to "dev", which boots a different container than
          # the one warmed above and whose dev-only bundles are absent from a
          # --no-dev install.
          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" \
            doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration

          # mv -T over a symlink is atomic: no request sees a half-built state.
          ln -sfn "releases/$RELEASE" current.new && mv -Tf current.new current
          echo "current -> $(readlink current)"

          # Keep the five most recent releases, discard older ones.
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -r --
          REMOTE
          } | ssh target bash -s

      # ---------------------------------------------------------- verify ---
      - name: Wait for the site to answer
        env:
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS --max-time 10 -o /dev/null "$SITE_BASE/" && { echo "up after ${i}s"; exit 0; }
            sleep 2
          done
          echo "::error::site did not answer within 60s"
          exit 1

      - name: Smoke test
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://api.mshaninah.com' }}
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          probe() {
            local name=$1 url=$2 want=$3 method=${4:-GET} data=${5:-}
            local code
            if [ -n "$data" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                     -X "$method" -H 'Content-Type: application/json' -d "$data" "$url")
            else
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$method" "$url")
            fi
            [ "$code" = "$want" ] || { echo "::error::$name: expected $want, got $code ($url)"; return 1; }
            echo "ok  $name -> $code"
          }

          probe 'frontend served'   "$SITE_BASE/"                   200
          probe 'public portfolio'  "$API_BASE/api/portfolio"       200
          probe 'public projects'   "$API_BASE/api/projects"        200
          probe 'unknown project'   "$API_BASE/api/projects/nope"   404
          probe 'admin is guarded'  "$API_BASE/api/admin/portfolio" 401

          # Load-bearing: Symfony resolves %env() lazily, so a missing
          # ADMIN_PASSWORD_HASH breaks neither the build nor the boot. A 401
          # here proves the secret is present and verification actually ran.
          probe 'login rejects bad password' "$API_BASE/api/admin/login" 401 \
                POST '{"password":"ci-smoke-deliberately-wrong"}'

      - name: Roll back
        if: failure()
        run: |
          set -euo pipefail
          echo "::warning::deploy or smoke test failed - attempting rollback"
          # Captured so the final message can state what actually happened.
          # Always claiming "rolled back" is misleading on a first deploy,
          # where there is no previous release to go back to.
          out=$(
          {
            printf 'API_DIR=%q\n' "$API_DIR"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"
          if [ ! -s .previous_release ]; then
            echo "no previous release recorded; leaving current as it is"
            exit 0
          fi
          prev="$(cat .previous_release)"
          [ -d "releases/$prev" ] || { echo "previous release $prev is gone"; exit 0; }
          ln -sfn "releases/$prev" current.new && mv -Tf current.new current
          echo "rolled back to $prev"
          REMOTE
          } | ssh target bash -s
          )
          echo "$out"

          # Migrations are NOT reversed either way. Rolling the schema back is
          # a deliberate, manual decision:
          #   <php> releases/<prev>/bin/console doctrine:migrations:migrate prev
          if printf '%s' "$out" | grep -q 'rolled back to'; then
            echo "::error::rolled back to the previous release; the schema was left migrated"
          else
            echo "::error::deploy failed and nothing was rolled back - see the failing step above for the real error"
          fi
          exit 1

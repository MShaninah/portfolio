name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
    env:
      DEPLOY_PHP: ${{ vars.DEPLOY_PHP || '/opt/plesk/php/tuxcare-php-8.5/bin/php' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      API_DIR: ${{ vars.DEPLOY_DIR }}
      WEB_DOCROOT: ${{ vars.WEB_DOCROOT }}
      RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --optimize-autoloader --classmap-authoritative --no-scripts

      - name: Warm the production cache
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
        run: php bin/console cache:warmup --env=prod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: Build the frontend
        working-directory: vue
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the release
        run: |
          set -euo pipefail
          mkdir -p release/api
          cp -r bin config migrations public src vendor \
                .env composer.json composer.lock release/api/

          test -f release/api/composer.json
          test -f release/api/public/.htaccess
          test ! -e release/api/.env.local
          test ! -d release/api/tests
          test ! -d release/api/var

          du -sh release/api | sed 's/^/  api release: /'
          du -sh vue/dist    | sed 's/^/  web release: /'

      - name: Verify the assembled release actually boots
        run: |
          set -euo pipefail
          cp -a release/api "$RUNNER_TEMP/verify"
          cmds=$("$RUNNER_TEMP/verify/bin/console" list --env=prod 2>&1 || true)

          if ! printf '%s' "$cmds" | grep -q 'doctrine:migrations:migrate'; then
            echo "::error::the assembled release boots without its bundles - \
          doctrine:migrations:migrate is missing. Check that composer.json and \
          config/ are present in the release."
            printf '%s\n' "$cmds" | head -40
            exit 1
          fi
          echo "release boots: $(printf '%s' "$cmds" | grep -c 'doctrine:migrations:') migration commands registered"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Preflight the server
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q WEB_DOCROOT=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$WEB_DOCROOT"
            cat <<'REMOTE'
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$API_DIR" ]     || fail "DEPLOY_DIR variable is empty"
          [ -n "$WEB_DOCROOT" ] || fail "WEB_DOCROOT variable is empty"
          [ -x "$DEPLOY_PHP" ]  || fail "no PHP binary at $DEPLOY_PHP"

          ver="$("$DEPLOY_PHP" -r 'echo PHP_VERSION;')"
          echo "server PHP: $ver"

          "$DEPLOY_PHP" -r '
            $v = PHP_VERSION;
            $ok = (version_compare($v, "8.4.27", ">=") && version_compare($v, "8.5.0", "<"))
               || version_compare($v, "8.5.12", ">=");
            exit($ok ? 0 : 1);
          ' || fail "server PHP $ver is unpatched or too old (need 8.4.27+ or 8.5.12+)"

          for ext in pdo_mysql intl zip; do
            "$DEPLOY_PHP" -m | grep -qx "$ext" || fail "PHP extension missing on the server: $ext"
          done

          if [ ! -f "$API_DIR/shared/.env.local" ]; then
            echo "looked for: $API_DIR/shared/.env.local"
            echo "contents of $API_DIR:"
            ls -la "$API_DIR"        2>&1 | sed 's/^/    /' || true
            echo "contents of $API_DIR/shared:"
            ls -la "$API_DIR/shared" 2>&1 | sed 's/^/    /' || true
            fail "$API_DIR/shared/.env.local is missing - create it before the first deploy"
          fi

          mkdir -p "$API_DIR/releases" "$API_DIR/shared/var/log"
          [ -d "$WEB_DOCROOT" ] || fail "WEB_DOCROOT $WEB_DOCROOT does not exist"
          echo "preflight OK"
          REMOTE
          } | ssh target bash -s

      - name: Upload the API release
        run: |
          set -euo pipefail
          rsync -az --delete -e ssh release/api/ "target:$API_DIR/releases/$RELEASE/"

      - name: Upload the frontend
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='cgi-bin/' \
            --exclude='.well-known/' \
            --exclude='error_docs/' \
            --exclude='.htaccess' \
            -e ssh vue/dist/ "target:$WEB_DOCROOT/"

      - name: Migrate and activate
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q RELEASE=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$RELEASE"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"

          if [ -L current ]; then
            basename "$(readlink -f current)" > .previous_release
          fi
          echo "activating $RELEASE (previous: $(cat .previous_release 2>/dev/null || echo none))"

          ln -sfn "$API_DIR/shared/.env.local" "releases/$RELEASE/.env.local"

          mkdir -p "releases/$RELEASE/var"
          ln -sfn "$API_DIR/shared/var/log" "releases/$RELEASE/var/log"

          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" cache:warmup --env=prod

          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" \
            doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration

          ln -sfn "releases/$RELEASE" current.new && mv -Tf current.new current
          echo "current -> $(readlink current)"

          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -r --
          REMOTE
          } | ssh target bash -s

      - name: Wait for the site to answer
        env:
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS --max-time 10 -o /dev/null "$SITE_BASE/" && { echo "up after ${i}s"; exit 0; }
            sleep 2
          done
          echo "::error::site did not answer within 60s"
          exit 1

      - name: Smoke test
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://api.mshaninah.com' }}
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          probe() {
            local name=$1 url=$2 want=$3 method=${4:-GET} data=${5:-}
            local code
            if [ -n "$data" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                     -X "$method" -H 'Content-Type: application/json' -d "$data" "$url")
            else
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$method" "$url")
            fi
            [ "$code" = "$want" ] || { echo "::error::$name: expected $want, got $code ($url)"; return 1; }
            echo "ok  $name -> $code"
          }

          probe 'frontend served'   "$SITE_BASE/"                   200
          probe 'public portfolio'  "$API_BASE/api/portfolio"       200
          probe 'public projects'   "$API_BASE/api/projects"        200
          probe 'unknown project'   "$API_BASE/api/projects/nope"   404
          probe 'admin is guarded'  "$API_BASE/api/admin/portfolio" 401

          probe 'login rejects bad password' "$API_BASE/api/admin/login" 401 \
                POST '{"password":"ci-smoke-deliberately-wrong"}'

      - name: Roll back
        if: failure()
        run: |
          set -euo pipefail
          echo "::warning::deploy or smoke test failed - attempting rollback"
          out=$(
          {
            printf 'API_DIR=%q\n' "$API_DIR"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"
          if [ ! -s .previous_release ]; then
            echo "no previous release recorded; leaving current as it is"
            exit 0
          fi
          prev="$(cat .previous_release)"
          [ -d "releases/$prev" ] || { echo "previous release $prev is gone"; exit 0; }
          ln -sfn "releases/$prev" current.new && mv -Tf current.new current
          echo "rolled back to $prev"
          REMOTE
          } | ssh target bash -s
          )
          echo "$out"

          if printf '%s' "$out" | grep -q 'rolled back to'; then
            echo "::error::rolled back to the previous release; the schema was left migrated"
          else
            echo "::error::deploy failed and nothing was rolled back - see the failing step above for the real error"
          fi
          exit 1

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
    env:
      DEPLOY_PHP: ${{ vars.DEPLOY_PHP || '/opt/plesk/php/tuxcare-php-8.5/bin/php' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      API_DIR: ${{ vars.DEPLOY_DIR }}
      WEB_DOCROOT: ${{ vars.WEB_DOCROOT }}
      RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --optimize-autoloader --classmap-authoritative --no-scripts

      - name: Warm the production cache
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
        run: php bin/console cache:warmup --env=prod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: Build the frontend
        working-directory: vue
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the release
        run: |
          set -euo pipefail
          mkdir -p release/api
          cp -r bin config migrations public src vendor \
                .env composer.json composer.lock release/api/

          test -f release/api/composer.json
          test -f release/api/public/.htaccess
          test ! -e release/api/.env.local
          test ! -d release/api/tests
          test ! -d release/api/var

          du -sh release/api | sed 's/^/  api release: /'
          du -sh vue/dist    | sed 's/^/  web release: /'

      - name: Verify the assembled release actually boots
        run: |
          set -euo pipefail
          cp -a release/api "$RUNNER_TEMP/verify"
          cmds=$("$RUNNER_TEMP/verify/bin/console" list --env=prod 2>&1 || true)

          if ! printf '%s' "$cmds" | grep -q 'doctrine:migrations:migrate'; then
            echo "::error::the assembled release boots without its bundles - \
          doctrine:migrations:migrate is missing. Check that composer.json and \
          config/ are present in the release."
            printf '%s\n' "$cmds" | head -40
            exit 1
          fi
          echo "release boots: $(printf '%s' "$cmds" | grep -c 'doctrine:migrations:') migration commands registered"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Preflight the server
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q WEB_DOCROOT=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$WEB_DOCROOT"
            cat <<'REMOTE'
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$API_DIR" ]     || fail "DEPLOY_DIR variable is empty"
          [ -n "$WEB_DOCROOT" ] || fail "WEB_DOCROOT variable is empty"
          [ -x "$DEPLOY_PHP" ]  || fail "no PHP binary at $DEPLOY_PHP"

          ver="$("$DEPLOY_PHP" -r 'echo PHP_VERSION;')"
          echo "server PHP: $ver"

          "$DEPLOY_PHP" -r '
            $v = PHP_VERSION;
            $ok = (version_compare($v, "8.4.27", ">=") && version_compare($v, "8.5.0", "<"))
               || version_compare($v, "8.5.12", ">=");
            exit($ok ? 0 : 1);
          ' || fail "server PHP $ver is unpatched or too old (need 8.4.27+ or 8.5.12+)"

          for ext in pdo_mysql intl zip; do
            "$DEPLOY_PHP" -m | grep -qx "$ext" || fail "PHP extension missing on the server: $ext"
          done

          if [ -f "$API_DIR/shared/.env.local" ] \
             && grep -qE 'CHANGE_ME|@db:|DB_USER|DB_NAME' "$API_DIR/shared/.env.local"; then
            fail "shared/.env.local still holds placeholders from .env.prod.example - fill in the real database credentials (host is 127.0.0.1 on this server, not 'db')"
          fi

          if [ ! -f "$API_DIR/shared/.env.local" ]; then
            echo "looked for: $API_DIR/shared/.env.local"
            echo "contents of $API_DIR:"
            ls -la "$API_DIR"        2>&1 | sed 's/^/    /' || true
            echo "contents of $API_DIR/shared:"
            ls -la "$API_DIR/shared" 2>&1 | sed 's/^/    /' || true
            fail "$API_DIR/shared/.env.local is missing - create it before the first deploy"
          fi

          mkdir -p "$API_DIR/releases" "$API_DIR/shared/var/log" "$API_DIR/shared/var/storage"
          [ -d "$WEB_DOCROOT" ] || fail "WEB_DOCROOT $WEB_DOCROOT does not exist"

          if [ -e "$API_DIR/current/public" ]; then
            ln -sfn "$API_DIR/current/public" "$WEB_DOCROOT/_api"
            echo "_api -> $(readlink "$WEB_DOCROOT/_api")"
          else
            echo "no active release yet; _api will be linked after the first activation"
          fi

          echo "preflight OK"
          REMOTE
          } | ssh target bash -s

      - name: Check TLS certificates
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://mshaninah.com' }}
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          bad=0
          for base in $(printf '%s\n' "$SITE_BASE" "$API_BASE" | sort -u); do
            host=${base#*://}
            host=${host%%/*}

            end=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)

            if [ -z "$end" ]; then
              echo "::error::$host: no TLS certificate could be read"
              bad=1
              continue
            fi

            left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))

            if [ "$left" -lt 0 ]; then
              echo "::error::$host: certificate EXPIRED $(( -left )) days ago, on $end. Bind this domain to a current certificate in Plesk - a wildcard issued for the parent domain already covers its subdomains, so no separate certificate is needed."
              bad=1
            elif [ "$left" -lt 14 ]; then
              echo "::warning::$host: certificate expires in $left days, on $end"
            else
              echo "ok  $host: certificate valid for $left more days"
            fi
          done
          [ "$bad" -eq 0 ]

      - name: Verify the API document root
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          probe="deploy-probe-$RANDOM$RANDOM.txt"

          state=$(
          {
            printf 'API_DIR=%q probe=%q\n' "$API_DIR" "$probe"
            cat <<'REMOTE'
          set -euo pipefail
          if [ ! -e "$API_DIR/current/public" ]; then
            echo first-deploy
            exit 0
          fi
          : > "$API_DIR/current/public/$probe"
          echo placed
          REMOTE
          } | ssh target bash -s
          )

          if [ "$state" = first-deploy ]; then
            echo "no release is active yet; the smoke test checks the document root instead"
            exit 0
          fi

          set +e
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$API_BASE/_api/$probe" 2>"$RUNNER_TEMP/probe.err")
          rc=$?
          set -e

          {
            printf 'API_DIR=%q probe=%q\n' "$API_DIR" "$probe"
            echo 'rm -f "$API_DIR/current/public/$probe"'
          } | ssh target bash -s

          if [ "$rc" -ne 0 ]; then
            echo "::error::$API_BASE could not be reached at all (curl exit $rc): $(tr '\n' ' ' < "$RUNNER_TEMP/probe.err"). This is NOT a document-root problem - no HTTP answer came back. Check the domain's TLS certificate and that its vhost is running."
            exit 1
          fi

          if [ "$code" != 200 ]; then
            echo "::error::$API_BASE does not serve $API_DIR/current/public through /_api - a file placed there answered $code. Either the _api symlink in the web document root is missing, or Apache is not honouring the .htaccess that routes /api to it. In Plesk, open Websites & Domains, the API domain, Hosting Settings, and set the document root to current/public. Plesk states this relative to the subscription root on some versions, so the value may need to be api.mshaninah.com/current/public - compare it with the main domain's, which is a folder directly under the subscription root. Stopping now, before the database is migrated."
            exit 1
          fi

          echo "document root confirmed: $API_BASE serves the active release's public/"

      - name: Upload the API release
        run: |
          set -euo pipefail
          rsync -az --delete -e ssh release/api/ "target:$API_DIR/releases/$RELEASE/"

      - name: Upload the frontend
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='cgi-bin/' \
            --exclude='.well-known/' \
            --exclude='error_docs/' \
            --exclude='_api' \
            -e ssh vue/dist/ "target:$WEB_DOCROOT/"

      - name: Migrate
        run: |
          set -euo pipefail
          {
            printf 'DEPLOY_PHP=%q API_DIR=%q RELEASE=%q\n' \
              "$DEPLOY_PHP" "$API_DIR" "$RELEASE"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"

          ln -sfn "$API_DIR/shared/.env.local" "releases/$RELEASE/.env.local"

          mkdir -p "releases/$RELEASE/var"
          ln -sfn "$API_DIR/shared/var/log" "releases/$RELEASE/var/log"
          ln -sfn "$API_DIR/shared/var/storage" "releases/$RELEASE/var/storage"

          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" cache:warmup --env=prod

          "$DEPLOY_PHP" "releases/$RELEASE/bin/console" \
            doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration
          REMOTE
          } | ssh target bash -s
          echo "MIGRATED=yes" >> "$GITHUB_ENV"

      - name: Activate
        run: |
          set -euo pipefail
          {
            printf 'API_DIR=%q RELEASE=%q\n' "$API_DIR" "$RELEASE"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"

          if [ -L current ]; then
            basename "$(readlink -f current)" > .previous_release
          else
            rm -f .previous_release
          fi
          echo "activating $RELEASE (previous: $(cat .previous_release 2>/dev/null || echo none))"

          ln -sfn "releases/$RELEASE" current.new && mv -Tf current.new current
          echo "current -> $(readlink current)"

          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -r --
          REMOTE
          } | ssh target bash -s
          echo "ACTIVATED=yes" >> "$GITHUB_ENV"

      - name: Wait for the site to answer
        env:
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS --max-time 10 -o /dev/null "$SITE_BASE/" && { echo "up after ${i}s"; exit 0; }
            sleep 2
          done
          echo "::error::site did not answer within 60s"
          exit 1

      - name: Smoke test
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://mshaninah.com' }}
          SITE_BASE: ${{ vars.SITE_BASE_URL || 'https://mshaninah.com' }}
        run: |
          set -euo pipefail
          probe() {
            local name=$1 url=$2 want=$3 method=${4:-GET} data=${5:-}
            local code
            if [ -n "$data" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                     -X "$method" -H 'Content-Type: application/json' -d "$data" "$url")
            else
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$method" "$url")
            fi
            [ "$code" = "$want" ] || { echo "::error::$name: expected $want, got $code ($url)"; return 1; }
            echo "ok  $name -> $code"
          }

          probe 'frontend served'   "$SITE_BASE/"                   200
          probe 'public portfolio'  "$API_BASE/api/portfolio"       200
          probe 'public projects'   "$API_BASE/api/projects"        200
          probe 'unknown project'   "$API_BASE/api/projects/nope"   404
          probe 'admin is guarded'  "$API_BASE/api/admin/portfolio" 401

          probe 'login rejects bad password' "$API_BASE/api/admin/login" 401 \
                POST '{"password":"ci-smoke-deliberately-wrong"}'

          http_site="${SITE_BASE/https:/http:}"
          redirect=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$http_site/" || echo 000)
          case "$redirect" in
            30[1278])
              echo "ok  http redirects to https -> $redirect"
              ;;
            *)
              echo "::warning::$http_site answered $redirect instead of redirecting to https, so anyone typing the bare domain gets a plain-HTTP page and a \"Not secure\" warning. Enable the permanent SEO-safe 301 redirect from HTTP to HTTPS in Plesk for this domain. Not failing the deploy: the release itself is fine."
              ;;
          esac

      - name: Roll back
        if: failure()
        run: |
          set -euo pipefail

          if [ "${ACTIVATED:-}" != yes ]; then
            if [ "${MIGRATED:-}" = yes ]; then
              echo "::error::failed after the schema was migrated but before the new release went live. The previous release is still serving and the schema is ahead of it - check it before retrying."
            else
              echo "::error::failed before anything on the server was changed, so there is nothing to roll back. The real error is in the failing step above."
            fi
            exit 1
          fi

          echo "::warning::deploy failed after activation - attempting rollback"
          out=$(
          {
            printf 'API_DIR=%q\n' "$API_DIR"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"
          if [ ! -s .previous_release ]; then
            echo "no previous release recorded; leaving current as it is"
            exit 0
          fi
          prev="$(cat .previous_release)"
          [ -d "releases/$prev" ] || { echo "previous release $prev is gone"; exit 0; }
          ln -sfn "releases/$prev" current.new && mv -Tf current.new current
          echo "rolled back to $prev"
          REMOTE
          } | ssh target bash -s
          )
          echo "$out"

          if printf '%s' "$out" | grep -q 'rolled back to'; then
            echo "::error::rolled back to the previous release; the schema was left migrated"
          else
            echo "::error::deploy failed and nothing was rolled back - see the failing step above for the real error"
          fi
          exit 1

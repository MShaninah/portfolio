framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Contact email is sent synchronously and on purpose: it is rate
            # limited to 5/minute, and sending inline is what lets the endpoint
            # report a real delivery failure instead of silently queuing a
            # message that no worker was running to consume.
            #
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

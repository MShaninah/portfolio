; Production PHP configuration, baked into the image.

expose_php = Off
memory_limit = 256M

; The image is immutable, so opcache never needs to stat files for changes.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; config/preload.php is guarded by file_exists(), so this stays safe even if
; the warmed prod cache is ever absent.
opcache.preload = /app/config/preload.php
; The php-fpm master runs as root and drops workers to www-data, so preloading
; must be attributed to that unprivileged user.
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600

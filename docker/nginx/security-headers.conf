# Included in every location that sets its own add_header.
#
# nginx's add_header does NOT inherit into a location that declares any
# add_header of its own, so these must be repeated wherever that happens or
# they silently vanish from those responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# Production server: serves the built Vue SPA and forwards /api to php-fpm.
#
# One server block handles both hostnames:
#   api.mshaninah.com/api/...  -> matches /api/ -> Symfony
#   mshaninah.com/...          -> SPA fallback  -> index.html

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- API ---
    # Everything under /api is handed to the Symfony front controller. There is
    # no try_files here: SCRIPT_FILENAME is resolved inside the php-fpm
    # container's own filesystem, not this one.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;

        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /app/public;
        fastcgi_param REQUEST_URI     $request_uri;

        fastcgi_read_timeout 30s;
        fastcgi_buffering on;

        # CORS belongs to NelmioCorsBundle and must NOT be added here. Doing so
        # previously reflected any Origin with credentials -- a wildcard-with-
        # credentials bypass -- and emitted a duplicate
        # Access-Control-Allow-Origin that browsers reject outright.
    }

    # ----------------------------------------------------------- frontend ---
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or returning visitors keep requesting
    # asset filenames that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.env, .git, editor backups).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

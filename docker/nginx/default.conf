server {
  listen 80;
  server_name _;

  root /project/public;
  index index.php;

  # NOTE: CORS is handled exclusively by NelmioCorsBundle (see
  # config/packages/nelmio_cors.yaml), which validates the Origin against a
  # configured allowlist.
  #
  # This block previously reflected the caller's Origin unconditionally
  # (add_header 'Access-Control-Allow-Origin' "$http_origin") together with
  # Access-Control-Allow-Credentials: true. That is the "wildcard with
  # credentials" pattern: it let ANY site read authenticated API responses,
  # overrode the application's allowlist, and emitted a second, duplicate
  # Access-Control-Allow-Origin header that browsers reject outright.
  # Do not reintroduce CORS headers here.

  # Hardening headers that do not depend on the request origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri /index.php$is_args$args;
  }

  # Only the single front controller may execute PHP. Without this, any other
  # .php file that ever lands under public/ would be executable.
  location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_pass php-fpm:9000;
    internal;
  }

  location ~ \.php$ {
    return 404;
  }

  # Never serve dotfiles (.env, .git, editor backups).
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}

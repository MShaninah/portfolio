server {
  listen 80;
  server_name _;

  root /var/www/backend/public;
  index index.php;

  location / {
    try_files $uri /index.php$is_args$args;
  }

  location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php-fpm:9000;
  }

  location ~ \.php$ {
    return 404;
  }
}

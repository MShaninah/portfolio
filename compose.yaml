services:
  nginx:
    image: nginx:alpine
    depends_on:
      - php-fpm
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/project:ro
    restart: unless-stopped
    networks:
      - portfolio_local

  db:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "6606:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portfolio_local

  php-fpm:
    build:
      context: docker/php
    restart: unless-stopped
    depends_on:
      - db
      - mailhog
    expose:
      - "9000"
    volumes:
      - ./:/project
    working_dir: /project
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      # Symfony DB + Mail DSNs inside docker network
      DATABASE_URL: "mysql://portfolio:portfolio@db:3306/portfolio?serverVersion=8.0"
      MAILER_DSN: "smtp://mailhog:1025"
      CONTACT_TO: "mohamad@mshaninah.com"
      CONTACT_FROM: "no-reply@mshaninah.com"
      # Optional if you have custom ini files
      PHP_INI_SCAN_DIR: ":/usr/local/etc/php/custom.d"
    networks:
      - portfolio_local

  # One-shot tool container, used as:
  #   docker compose run --rm php-cli 'php bin/console ...'
  #
  # It has no long-running command, so `restart: unless-stopped` made it exit
  # and respawn forever. The profile keeps `docker compose up` from starting it
  # at all, while `docker compose run` still works regardless of the profile.
  php-cli:
    profiles: ["tools"]
    build:
      context: docker/php-cli
    depends_on:
      - db
      - mailhog
    volumes:
      - ./:/project
    working_dir: /project
    # Must mirror php-fpm. Without these the console falls back to .env.local,
    # whose DSN points at the host-side port mapping (127.0.0.1:6606) and does
    # not resolve from inside the compose network.
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "mysql://portfolio:portfolio@db:3306/portfolio?serverVersion=8.0.36&charset=utf8mb4"
      MAILER_DSN: "smtp://mailhog:1025"
    entrypoint: ["/bin/sh", "-lc"]
    networks:
      - portfolio_local

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - portfolio_local

networks:
  portfolio_local:

volumes:
  db_data:
